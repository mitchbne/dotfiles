[settings]
idiomatic_version_file_enable_tools = ["ruby", "terraform"]

[settings.ruby]
compile = false

# Use `gh auth token` so mise can authenticate to GitHub without storing a PAT.
# On macOS, `gh auth login` stashes tokens in Keychain (not hosts.yml), so
# mise's built-in gh CLI integration can't read them directly.
[settings.github]
credential_command = "gh auth token"

[tools]
go = "latest"
node = "latest"
ruby = "latest"

# CLI tools
starship = "latest"
github-cli = "latest"
ripgrep = "latest"
jq = "latest"
lefthook = "latest"
shellcheck = "latest"
overmind = "latest"
k9s = "latest"
helm = "latest"
tflint = "latest"
bik = "latest"
"github:namespacelabs/foundation" = { version = "latest", matching_regex = "^nsc_" }
"github:buildkite/cli" = "latest"
"github:buildkite/agent" = "latest"

# Ruby gems
"gem:ruby-lsp" = "latest"
"github:buildkite/slopcannon" = "latest"
